name: Generate Activity Report

on:
  schedule:
    - cron: '0 0 * * *' # Runs daily at midnight
  workflow_dispatch: # Allows manual trigger

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0 # Get all history

      - name: Generate activity.md, evaluate.md and at-risk.md
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: ./generate_activity.sh

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add activity.md evaluate.md at-risk.md
          git commit -m "Update activity, evaluate, and at-risk reports" || echo "No changes to commit"
          git push
